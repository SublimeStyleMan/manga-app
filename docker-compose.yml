services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    volumes:
      - ./server:/src
      - ./proto:/proto
      - /src/bin
      - /src/obj
      - nuget:/root/.nuget/packages
    ports:
      - "8080:8080"
      - "8081:8081"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server

  # Runs once and exits: docker compose run --rm codegen
  codegen:
    build: ./codegen
    profiles: ["tools"]
    volumes:
      - ./proto:/proto:ro
      - ./web/src/gen:/out

  # Stays running; regenerates the TS client whenever a .proto changes.
  codegen-watch:
    build: ./codegen
    command: ["sh", "/codegen/watch.sh"]
    volumes:
      - ./proto:/proto:ro
      - ./web/src/gen:/out

volumes:
  nuget: